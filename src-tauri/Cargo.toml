[package]
name = "droid-debug-workbench"
version = "0.1.0"
description = "Android debugging workbench for ROM, app, and QA engineers"
authors = ["zhouxw"]
license = "MIT"
repository = "https://github.com/xiaowenzhou/DroidDebugWorkbench"
edition = "2021"
rust-version = "1.78"
default-run = "droid-debug-workbench"

[lib]
name = "droid_debug_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "droid-debug-workbench"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.2" }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.2" }
